[project]
name = "hexos"
version = "0.1.0"
description = "Heat-Electricity eXchange Optimization System: a Pyomo MILP for corporate multi-energy sector coupling"
requires-python = ">=3.10"
dependencies = [
    "pyomo>=6.7",
    "highspy>=1.7",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
